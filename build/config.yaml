  mtu: 1250
  proxy: true
  gateway: "172.19.0.254"
  subnetMask: "255.255.255.0"

# 服务端配置
server:
  port: 9999
  ifName: "LwyV-Gateway"
  egressIf: ""

# 客户端连接配置
client:
  ifName: "LwyV-NetAdapter"
  serverIP: "111.229.84.165:9999"

# 虚拟DHCP配置
vdhcp:
  startIP: "172.19.0.10"
  endIP: "172.19.0.200"
