# 通用配置
common:
  # Noise IK / ECDH 身份密钥（base64 32 bytes）
  privateKey: "REPLACE_WITH_LOCAL_PRIVATE_KEY_BASE64"
  # 对端设备长期公钥（base64 32 bytes）
  peerPublicKey: "REPLACE_WITH_PEER_PUBLIC_KEY_BASE64"
  mtu: 1250
  mode: "kcp"
  proxy: true
  gateway: "172.19.0.254"
  subnetMask: "255.255.255.0"

# 服务端配置
server:
  port: 9999
  ifName: "LwyV-Gateway"
  egressIf: ""

# 客户端连接配置
client:
  ifName: "LwyV-NetAdapter"
  serverIP: "111.229.84.165:9999"

# 虚拟DHCP配置
vdhcp:
  startIP: "172.19.0.10"
  endIP: "172.19.0.200"
